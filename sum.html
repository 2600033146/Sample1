<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addition</title>
</head>
<body>
    <h2>Addition of two numbers</h2>
    <input type="number" id="num1" placeholder="Enter first number"/><br/><br/>
     <input type="number" id="num2" placeholder="Enter Second number"/><br/><br/>
     <button onclick="addNumbers()">Add</button>
     <button onclick="subNumbers()">Sub</button>
     <h3 id="result1"></h3>
     <h4 id="result2" ></h4>
     <script>
        function addNumbers(){
            let a=Number(document.getElementById("num1").value);
             let b=Number(document.getElementById("num2").value);
             let sum=a+b;
             document.getElementById("result1").innerHTML="Addition=" +sum;

        }
         function subNumbers(){
            let a=Number(document.getElementById("num1").value);
             let b=Number(document.getElementById("num2").value);
             let sub=a-b;
             document.getElementById("result2").innerHTML="Subraction=" +sub;

        }
        
     </script>
</body>
</html>
